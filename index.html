<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLF-C02 マークシート演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --ink:#1C2740; --sub:#5A6375; --line:#D3D9E3;
  --guide:#2F64B0; --guide-soft:#E6EEF9; --mark:#262B35;
  --ok:#1C7A50; --ok-soft:#E3F3EA; --ng:#BF3A2B; --ng-soft:#FBE8E5;
  --flag:#C98A0B; --flag-soft:#FBF1DA;
  --c:#2F64B0; --s:#8A3FA8; --t:#127B7E; --b:#B4651A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141922; --sheet:#1C2330; --ink:#E7ECF4; --sub:#9AA4B6; --line:#323C4D;
    --guide:#7FA7E6; --guide-soft:#22314A; --mark:#E7ECF4;
    --ok:#5CC994; --ok-soft:#1A3328; --ng:#F08572; --ng-soft:#3A221F;
    --flag:#E9B44C; --flag-soft:#3A3020;
    --c:#7FA7E6; --s:#C795DE; --t:#5CC4C6; --b:#E3A15F; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141922; --sheet:#1C2330; --ink:#E7ECF4; --sub:#9AA4B6; --line:#323C4D;
  --guide:#7FA7E6; --guide-soft:#22314A; --mark:#E7ECF4;
  --ok:#5CC994; --ok-soft:#1A3328; --ng:#F08572; --ng-soft:#3A221F;
  --flag:#E9B44C; --flag-soft:#3A3020;
  --c:#7FA7E6; --s:#C795DE; --t:#5CC4C6; --b:#E3A15F; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--sub)}
.small{font-size:13px}

/* buttons */
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.opt:focus-visible,.chip:focus-visible,.cell:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--guide);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* header (home) */
.mast{padding:28px 0 22px;border-bottom:2px solid var(--guide);margin-bottom:28px;position:relative}
.mast .code{font-weight:900;font-size:clamp(44px,12vw,76px);letter-spacing:-.02em;line-height:1;color:var(--guide)}
.mast h1{font-size:20px;font-weight:700;margin-top:10px}
.mast p{margin:6px 0 0;color:var(--sub);font-size:14px}
.marks{position:absolute;right:0;top:30px;display:grid;grid-template-columns:repeat(4,16px);gap:7px 8px}
.marks i{width:16px;height:24px;border:1.5px solid var(--guide);border-radius:50%;display:block;opacity:.75}
.marks i.f{background:var(--mark);border-color:var(--mark);opacity:1}
@media (max-width:480px){.marks{display:none}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);margin-bottom:32px}
.stats div{padding:14px 16px;border-left:1.5px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:26px;font-weight:900;line-height:1.2}
.stats span{font-size:12px;color:var(--sub)}

section.block{margin-bottom:34px}
section.block>h2{font-size:18px;font-weight:900;margin-bottom:4px}
section.block>p.lead{margin:0 0 14px;color:var(--sub);font-size:14px}
.panel{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:18px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;white-space:nowrap;flex:1 1 auto;cursor:pointer;min-height:40px;font-weight:500;border-left:1.5px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;background:transparent;min-height:40px}
.chip .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--dc);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--dc)}
.chip[aria-pressed="true"] .dot{background:var(--dc)}
.note{font-size:13px;color:var(--sub);margin-top:8px}
.warn{color:var(--ng)}

.exam-card{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.exam-card .big{font-weight:900;font-size:30px;line-height:1.1}
.exam-card .big small{font-size:14px;font-weight:500;color:var(--sub);margin-left:4px}

/* history */
.spark{width:100%;height:110px;display:block}
.hist-list{list-style:none;margin:12px 0 0;padding:0}
.hist-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.weak{list-style:none;padding:0;margin:8px 0 0}
.weak li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.weak li .rate{font-weight:700;color:var(--ng);white-space:nowrap}
.sync{font-size:12px;color:var(--sub);margin-top:10px}

/* question screen */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding:10px 0 10px;border-bottom:1.5px solid var(--line);margin-bottom:20px}
.bar .row{justify-content:space-between}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--guide);transition:width .25s}
.qno{font-weight:900;font-size:15px}
.timer{font-weight:900;font-variant-numeric:tabular-nums;font-size:18px}
.timer.low{color:var(--ng)}
.iconbtn{border:1.5px solid var(--line);background:transparent;border-radius:8px;min-height:40px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.iconbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-soft);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.dtag{display:inline-block;font-size:12px;font-weight:700;color:var(--dc);border:1.5px solid var(--dc);border-radius:4px;padding:0 8px;margin-bottom:10px}
.qtext{font-size:18px;font-weight:700;line-height:1.7;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:56px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--guide)}
.opt:disabled{cursor:default}
.oval{flex:none;width:26px;height:38px;border-radius:50%;border:1.8px solid var(--guide);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--guide);transition:background .15s,border-color .15s,color .15s}
.opt.sel .oval{background:var(--mark);border-color:var(--mark);color:transparent}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .oval{border-color:var(--ok);color:var(--ok)}
.opt.ok.sel .oval{background:var(--ok);border-color:var(--ok);color:transparent}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng.sel .oval{background:var(--ng);border-color:var(--ng)}
.opt .verdict{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.ok .verdict{color:var(--ok)} .opt.ng .verdict{color:var(--ng)}
.explain{margin-top:18px;border-left:4px solid var(--ok);background:var(--sheet);padding:14px 16px;border-radius:0 10px 10px 0}
.explain.ng{border-left-color:var(--ng)}
.explain h3{font-size:16px;margin-bottom:4px}
.explain.ok h3{color:var(--ok)} .explain.ng h3{color:var(--ng)}
.explain p{margin:0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.prog i,.oval{transition:none}}

/* exam grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.cell{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;height:38px;cursor:pointer;font-size:13px;font-weight:700;position:relative;color:var(--sub)}
.cell.ans{background:var(--guide-soft);border-color:var(--guide);color:var(--ink)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1.5px solid var(--line)}

/* results */
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:12px 0 22px;border-bottom:2px solid var(--guide);margin-bottom:24px}
.score .pct{font-size:clamp(64px,18vw,104px);font-weight:900;line-height:.9;letter-spacing:-.03em}
.score .pct small{font-size:.38em;font-weight:700;margin-left:2px}
.score .meta{padding-bottom:8px}
.score .meta b{font-size:18px}
.pass{display:inline-block;font-size:13px;font-weight:700;border-radius:4px;padding:2px 10px;margin-top:6px}
.pass.y{background:var(--ok-soft);color:var(--ok)} .pass.n{background:var(--ng-soft);color:var(--ng)}
.dom{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.dom .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;position:relative}
.dom .track i{display:block;height:100%;background:var(--dc)}
.dom .track::after{content:"";position:absolute;left:70%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.dom .n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.review{list-style:none;padding:0;margin:0}
.review li{background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.review .q{font-weight:700;margin:4px 0 8px}
.review .a{font-size:14px;margin:2px 0}
.review .a.ngt{color:var(--ng)} .review .a.okt{color:var(--ok)}
.review .e{font-size:14px;color:var(--sub);margin:8px 0 0}
.review .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-back{position:fixed;inset:0;background:rgba(10,15,25,.5);display:grid;place-items:center;padding:20px;z-index:20}
.dlg{background:var(--sheet);border-radius:12px;padding:22px;max-width:420px;width:100%;border:1.5px solid var(--line)}
.dlg p{margin:0 0 18px}
.more{appearance:none;border:0;background:transparent;color:var(--guide);font-weight:700;cursor:pointer;padding:10px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.more .chev{display:inline-block;transition:transform .15s}
.more[aria-expanded="true"] .chev{transform:rotate(90deg)}
.more:focus-visible,.exam-row:focus-visible{outline:3px solid var(--guide);outline-offset:2px}
.exam-list{list-style:none;margin:8px 0 0;padding:0}
.exam-list li{border-top:1px solid var(--line)}
.exam-row{appearance:none;width:100%;border:0;background:transparent;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer;text-align:left;font-size:14px;min-height:44px}
.exam-row:disabled{cursor:default}
.exam-row .sc{font-weight:700;white-space:nowrap}
.exam-row .sc .p{display:inline-block;min-width:3.2em;text-align:right}
.exam-row .go{color:var(--guide);font-weight:700;margin-left:6px}
.exam-row .nod{color:var(--sub);font-size:12px;font-weight:500;margin-left:6px}
@media (prefers-reduced-motion:reduce){.more .chev{transition:none}}
.setsw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.setsw button{appearance:none;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:64px;position:relative;overflow:hidden}
.setsw button b{display:block;font-size:17px;font-weight:900}
.setsw button span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.setsw button[aria-selected="true"]{border-color:var(--ink);background:var(--sheet)}
.setsw button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--guide)}
.setsw button:focus-visible,.mock:focus-visible{outline:3px solid var(--guide);outline-offset:2px}
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.mock{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:72px}
.mock:hover{border-color:var(--guide)}
.mock b{display:block;font-size:16px;font-weight:900}
.mock span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.mock .sc{color:var(--ink);font-weight:700;font-size:13px}
.mrtag{display:inline-block;font-size:12px;font-weight:700;color:var(--sheet);background:var(--ink);border-radius:4px;padding:0 8px;margin:0 0 10px 6px}
.mrnote{font-size:13px;color:var(--ng);margin:10px 0 0;min-height:1em}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
const Q = [
// ===== 分野1: クラウドの概念 (c) 24問 =====
["c01","c","AWSクラウドの6つの利点の1つとして正しいものはどれですか?",["固定費(資本的支出)を変動費に置き換える","変動費を固定費に置き換える","データセンターの運用・保守に投資を増やす","キャパシティを事前に予測して確保する必要がある"],0,"クラウドでは先行投資(CapEx)の代わりに、使った分だけ支払う変動費(OpEx)にできます。ほかにも「キャパシティ予測が不要」「数分で世界展開」などの利点があります。"],
["c02","c","AWS Well-Architected フレームワークの6つの柱に「含まれない」ものはどれですか?",["スケーラビリティ","信頼性","持続可能性","コスト最適化"],0,"6つの柱は、運用上の優秀性・セキュリティ・信頼性・パフォーマンス効率・コスト最適化・持続可能性です。スケーラビリティは重要な概念ですが、柱の名前ではありません。"],
["c03","c","オンプレミスのアプリケーションを、変更を加えずにそのままAWSへ移行する移行戦略はどれですか?",["リホスト(Rehost)","リファクタリング(Refactor)","リプラットフォーム(Replatform)","リパーチェス(Repurchase)"],0,"リホストは「リフト&シフト」とも呼ばれ、アプリをそのまま移行します。リプラットフォームは一部最適化、リファクタリングはクラウドネイティブに再設計、リパーチェスはSaaSなどへの乗り換えです。"],
["c04","c","需要の増減に合わせて、リソースを自動的に拡張・縮小できるクラウドの特性はどれですか?",["伸縮性(Elasticity)","耐久性(Durability)","可用性(Availability)","機密性(Confidentiality)"],0,"伸縮性は需要に応じてリソースを自動で増減できる特性で、Auto Scalingなどで実現します。耐久性はデータが失われにくいこと、可用性はシステムが利用可能な状態を保つことです。"],
["c05","c","オンプレミスのデータセンターとAWSクラウドを接続して併用するデプロイモデルはどれですか?",["ハイブリッド","クラウドネイティブ(オールイン)","オンプレミス(プライベートクラウド)","マルチテナント"],0,"ハイブリッドデプロイは、既存のオンプレミス環境とクラウドを接続して使うモデルです。すべてをクラウドで動かすのがクラウドデプロイ、仮想化技術で社内に構築するのがオンプレミスデプロイです。"],
["c06","c","「規模の経済の恩恵を受ける」というクラウドの利点の説明として正しいものはどれですか?",["多数の顧客の利用が集約されるため、従量課金の料金が低くなる","自社でサーバーを大量購入すると割引が受けられる","利用量が多いほど料金が高くなる","データセンターを自社で建設する費用が安くなる"],0,"AWSは膨大な数の顧客の利用を集約することで規模の経済を実現し、その分を低い従量料金として顧客に還元しています。"],
["c07","c","Well-Architected フレームワークの「信頼性」の柱における設計原則はどれですか?",["障害から自動的に復旧する","すべての操作を手動で実行する","単一の大きなサーバーに集約する","キャパシティを推測で決める"],0,"信頼性の柱の設計原則には「障害から自動的に復旧する」「水平方向にスケールする」「キャパシティを推測しない」などがあります。"],
["c08","c","「運用をコードとして実行する」「小規模で可逆的な変更を頻繁に行う」を設計原則とするWell-Architectedの柱はどれですか?",["運用上の優秀性","パフォーマンス効率","セキュリティ","持続可能性"],0,"運用上の優秀性の柱は、システムの運用・監視と継続的な改善に焦点を当てています。運用手順をコード化し、小さな変更を頻繁に行うことが推奨されます。"],
["c09","c","「サーバーレスアーキテクチャを使用する」「数分でグローバル展開する」を設計原則とするWell-Architectedの柱はどれですか?",["パフォーマンス効率","信頼性","コスト最適化","運用上の優秀性"],0,"パフォーマンス効率の柱は、コンピューティングリソースを効率的に使うことに焦点を当て、最新技術の活用やサーバーレスの採用などを推奨しています。"],
["c10","c","ワークロードによる環境への影響(エネルギー消費など)を最小限に抑えることに焦点を当てたWell-Architectedの柱はどれですか?",["持続可能性","コスト最適化","運用上の優秀性","信頼性"],0,"持続可能性の柱は2021年に追加され、使用率の最大化やマネージドサービスの活用などで環境への影響を減らすことを目指します。"],
["c11","c","AWSクラウド導入フレームワーク(AWS CAF)のパースペクティブに「含まれない」ものはどれですか?",["マーケティング","ガバナンス","人材(People)","プラットフォーム"],0,"AWS CAFの6つのパースペクティブは、ビジネス・人材・ガバナンス・プラットフォーム・セキュリティ・オペレーションです。"],
["c12","c","AWS CAFにおいて、組織構造の変更やスタッフのトレーニング、スキル習得に焦点を当てたパースペクティブはどれですか?",["人材(People)","ビジネス","プラットフォーム","オペレーション"],0,"人材パースペクティブは、文化の変革、組織設計、トレーニングなど「人」の側面からクラウド導入を支援します。"],

["c25","c","クラウドを利用すると、ピーク需要に備えて過剰なサーバーを用意したり、不足して機会を逃したりする心配が減ります。これを表すAWSクラウドの利点はどれですか?",["キャパシティの推測が不要になる","規模の経済の恩恵を受ける","固定費を変動費に置き換える","数分でグローバルに展開できる"],0,"クラウドでは必要なときに必要な分だけリソースを増減できるため、事前に容量を見積もる必要がなくなります。これが「キャパシティの推測が不要になる」という利点です。"],
["c26","c","OSやミドルウェアの管理はプロバイダーに任せ、利用者はアプリケーションとデータの管理に集中できるクラウドのサービスモデルはどれですか?",["PaaS","IaaS","SaaS","オンプレミス"],0,"PaaS(Platform as a Service)では、実行基盤の管理をプロバイダーが担います。AWS Elastic Beanstalkなどが該当します。"],
["c27","c","仮想サーバーやネットワーク、ストレージなどの基本的な構成要素を提供し、利用者の管理の自由度が最も高いクラウドのサービスモデルはどれですか?",["IaaS","PaaS","SaaS","FaaS"],0,"IaaS(Infrastructure as a Service)では、OSより上のレイヤーを利用者が自由に管理できます。Amazon EC2が代表例です。"],
["c28","c","プロバイダーが提供する完成したアプリケーションを、インストールや運用管理なしでそのまま利用するサービスモデルはどれですか?",["SaaS","IaaS","PaaS","ハイブリッド"],0,"SaaS(Software as a Service)では、利用者はソフトウェアを使うだけで、基盤やアプリの運用はすべてプロバイダーが担います。Webメールなどが該当します。"],
["c29","c","1台の大きなリソースを複数の小さなリソースに置き換えて、障害の影響を小さくすることを推奨するWell-Architectedの柱はどれですか?",["信頼性","コスト最適化","持続可能性","運用上の優秀性"],0,"信頼性の柱には「水平方向にスケールしてワークロード全体の可用性を高める」という設計原則があります。リソースを分散させることで、単一の障害の影響を抑えられます。"],
["c30","c","「すべての運用上の障害から学ぶ」「運用手順を頻繁に改善する」を設計原則とするWell-Architectedの柱はどれですか?",["運用上の優秀性","セキュリティ","パフォーマンス効率","コスト最適化"],0,"運用上の優秀性の柱は、運用から得た教訓を共有し、手順を継続的に改善することを重視しています。"],
["c31","c","「トレーサビリティを実現する(操作や変更をリアルタイムで監視・記録する)」を設計原則とするWell-Architectedの柱はどれですか?",["セキュリティ","信頼性","持続可能性","パフォーマンス効率"],0,"セキュリティの柱では、ログやメトリクスを収集して操作を追跡できるようにし、問題に自動で対応することが推奨されています。"],
["c32","c","「支出を分析し、どのチームや製品のコストかを明らかにする」を設計原則とするWell-Architectedの柱はどれですか?",["コスト最適化","運用上の優秀性","信頼性","セキュリティ"],0,"コスト最適化の柱には「支出の分析と帰属」という設計原則があります。コストの発生源を明確にすることで、投資対効果を判断しやすくなります。"],
["c33","c","必要なハードウェアの総量を減らすために、リソースの使用率を最大化することを推奨するWell-Architectedの柱はどれですか?",["持続可能性","パフォーマンス効率","信頼性","運用上の優秀性"],0,"持続可能性の柱では、アイドル状態のリソースを減らして使用率を高めることで、エネルギー消費などの環境への影響を抑えることが推奨されています。"],
["c34","c","「インフラストラクチャへの変更は自動化によって管理する」を設計原則とするWell-Architectedの柱はどれですか?",["信頼性","持続可能性","コスト最適化","セキュリティ"],0,"信頼性の柱では、手作業による変更ミスを防ぐため、変更を自動化して追跡・レビューできるようにすることが推奨されています。"],
["c35","c","AWS CAFにおいて、クラウドへの投資がデジタルトランスフォーメーションとビジネス成果の加速につながるようにすることに焦点を当てたパースペクティブはどれですか?",["ビジネス","プラットフォーム","オペレーション","セキュリティ"],0,"ビジネスパースペクティブは、戦略、製品管理、データ活用など、クラウド投資をビジネスの成果に結びつけるための能力を扱います。"],
["c36","c","AWS CAFにおいて、プログラム管理、リスク管理、クラウドの財務管理などを通じて、クラウドの取り組みを統制するパースペクティブはどれですか?",["ガバナンス","人材(People)","ビジネス","プラットフォーム"],0,"ガバナンスパースペクティブは、組織のメリットを最大化しつつ、変革に伴うリスクを最小化するための統制に焦点を当てています。"],
["c37","c","AWS CAFにおいて、スケーラブルなハイブリッドクラウド基盤の構築や、アーキテクチャの設計に焦点を当てたパースペクティブはどれですか?",["プラットフォーム","ガバナンス","人材(People)","ビジネス"],0,"プラットフォームパースペクティブは、プラットフォームのエンジニアリング、データアーキテクチャ、CI/CDなどの技術的な能力を扱います。"],
["c38","c","AWS CAFにおいて、データやワークロードの機密性・完全性・可用性の確保に焦点を当てたパースペクティブはどれですか?",["セキュリティ","オペレーション","ガバナンス","プラットフォーム"],0,"セキュリティパースペクティブは、アイデンティティとアクセス管理、脅威検出、データ保護、インシデント対応などの能力を扱います。"],
["c39","c","AWS CAFにおいて、クラウドサービスがビジネスに必要な水準で提供されるように運用・監視することに焦点を当てたパースペクティブはどれですか?",["オペレーション","ビジネス","人材(People)","セキュリティ"],0,"オペレーションパースペクティブは、監視、インシデント管理、パッチ管理、可用性と継続性の管理などの能力を扱います。"],
["c40","c","AWS CAFが示す変革の4つの領域(ドメイン)に「含まれない」ものはどれですか?",["価格","テクノロジー","プロセス","組織"],0,"AWS CAFの変革の領域は、テクノロジー、プロセス、組織、製品の4つです。"],
["c41","c","AWS CAFを活用したクラウド変革によって期待できるビジネス成果として正しいものはどれですか?",["運用効率の向上","ハードウェア購入費の増加","手作業による運用の増加","データセンターの新設"],0,"AWS CAFでは、ビジネスリスクの軽減、ESGパフォーマンスの向上、収益の増加、運用効率の向上をクラウド変革の成果として挙げています。"],
["c42","c","法規制や技術的な理由から、一部のアプリケーションを当面はオンプレミスに残しておく移行戦略はどれですか?",["リテイン(Retain)","リタイア(Retire)","リホスト(Rehost)","リパーチェス(Repurchase)"],0,"リテインは、今は移行しない(保持する)と判断したアプリに適用します。準備が整ったら、あらためて移行を検討します。"],
["c43","c","自社で運用している顧客管理システムを廃止し、SaaS型のCRM製品に乗り換える移行戦略はどれですか?",["リパーチェス(Repurchase)","リプラットフォーム(Replatform)","リホスト(Rehost)","リロケート(Relocate)"],0,"リパーチェスは「ドロップ&ショップ」とも呼ばれ、既存の製品を別の製品(多くはSaaS)に置き換える戦略です。"],
["c44","c","モノリシックなアプリケーションを、マイクロサービスやサーバーレスを使ったクラウドネイティブな構成に作り直す移行戦略はどれですか?",["リファクタリング(Refactor)","リホスト(Rehost)","リテイン(Retain)","リタイア(Retire)"],0,"リファクタリング(リアーキテクト)は手間とコストがかかりますが、クラウドの機能を最大限に活かした拡張性や俊敏性を得られます。"],
["c45","c","VMware Cloud on AWSを使い、オンプレミスのVMware環境の仮想マシンを大量に、そのままの形でクラウドへ移す移行戦略はどれですか?",["リロケート(Relocate)","リファクタリング(Refactor)","リパーチェス(Repurchase)","リタイア(Retire)"],0,"リロケートは、ハードウェアの購入やアプリの書き換えをせずに、仮想化環境ごとクラウドへ移す戦略です。"],
["c46","c","オンプレミスのサーバーを、リホスト(リフト&シフト)の方式で自動的にAWSへ移行できるサービスはどれですか?",["AWS Application Migration Service","AWS Database Migration Service","AWS DataSync","AWS Migration Hub"],0,"AWS Application Migration Serviceは、ソースサーバーのデータを継続的にレプリケーションし、短いダウンタイムでEC2へ切り替えられます。"],
["c47","c","オンプレミスのファイルサーバーとAmazon S3やAmazon EFSとの間で、ネットワーク経由のデータ転送を自動化・高速化するサービスはどれですか?",["AWS DataSync","AWS Storage Gateway","Amazon CloudFront","AWS Direct Connect"],0,"AWS DataSyncは、大量のファイルをオンラインで効率よく転送・同期するためのサービスです。移行や定期的なデータ転送に使います。"],
["c48","c","OracleからAmazon Auroraへの移行など、異なるデータベースエンジン間でスキーマやコードを変換するのに使うものはどれですか?",["AWS Schema Conversion Tool(SCT)","AWS DataSync","AWS Backup","Amazon Athena"],0,"異なるエンジン間の移行では、まずSCT(またはDMS Schema Conversion)でスキーマを変換し、その後DMSでデータを移行するのが一般的です。"],
["c49","c","次のうち、資本的支出(CapEx)の例として正しいものはどれですか?",["データセンター用のサーバーハードウェアを購入する","EC2インスタンスを使った時間分だけ支払う","Lambdaのリクエスト数に応じて支払う","S3の保存量に応じて毎月支払う"],0,"資本的支出は、設備などに先行して投資する費用です。クラウドの従量課金のように、使った分だけ支払う費用は運用支出(OpEx)にあたります。"],
["c50","c","オンプレミスとAWSの総所有コスト(TCO)を比較する際に、オンプレミス側に含めるべき費用として適切なものはどれですか?",["電力、冷却、データセンター施設の費用","AWSのオンデマンド料金","AWSサポートの料金","AWS Marketplaceの購入費"],0,"TCOの比較では、サーバーの購入費だけでなく、電力・冷却・設備・運用の人件費などの間接的な費用も含めて比較することが重要です。"],
["c51","c","すでに保有しているソフトウェアのライセンスを、AWS上でも引き続き利用する方式を何と呼びますか?",["BYOL(Bring Your Own License)","リザーブドインスタンス","Savings Plans","AWS Marketplace"],0,"BYOLでは既存のライセンスをAWSに持ち込めます。ソケットやコア単位のライセンス要件がある場合は、Dedicated Hostsが使われます。"],
["c52","c","実際の使用状況に合わせて、インスタンスのタイプやサイズを過不足のない構成に見直すことを何と呼びますか?",["ライトサイジング(適正化)","スケールアウト","リホスト","フェイルオーバー"],0,"ライトサイジングは、使用率が低い過剰な構成を見直してコストを下げる、代表的なコスト最適化の手法です。"],
["c53","c","AWS CloudFormationなどでインフラをコード化(IaC)する利点として正しいものはどれですか?",["同じ環境を一貫した手順で何度でも再現でき、人的ミスが減る","手作業での設定が増える","リソースの料金が無料になる","AWSの責任範囲が広がる"],0,"IaCを使うと、環境の構築を自動化でき、開発・本番などで同じ構成を確実に再現できます。変更履歴の管理もしやすくなります。"],
["c54","c","Amazon RDSのようなマネージドサービスを利用する主な利点はどれですか?",["パッチ適用やバックアップなどの運用作業をAWSに任せ、アプリ開発に集中できる","データの管理責任がすべてAWSに移る","アクセス権限の設定が不要になる","料金が常に無料になる"],0,"マネージドサービスでは、OSやDBエンジンのパッチ適用、バックアップなどの運用作業をAWSが行います。ただし、データやアクセス管理は引き続き顧客の責任です。"],
["c55","c","一部のコンポーネントに障害が発生しても、サービスを中断せずに動作し続けるシステムの能力を何と呼びますか?",["耐障害性(フォールトトレランス)","伸縮性","俊敏性","規模の経済"],0,"耐障害性は、冗長化などによって障害が起きてもサービスを継続できる能力です。複数AZへの分散配置などで実現します。"],
["c56","c","負荷の増加に対応するため、EC2インスタンスをより大きなインスタンスタイプに変更して性能を上げる方法を何と呼びますか?",["垂直スケーリング(スケールアップ)","水平スケーリング(スケールアウト)","フェイルオーバー","レプリケーション"],0,"垂直スケーリングは1台の性能を上げる方法です。上限があり、変更時に停止が必要な場合があります。"],
["c57","c","負荷の増加に対応するため、同じ構成のEC2インスタンスの台数を増やす方法を何と呼びますか?",["水平スケーリング(スケールアウト)","垂直スケーリング(スケールアップ)","ライトサイジング","スナップショット"],0,"水平スケーリングは台数を増やして処理を分散する方法で、Auto ScalingやELBと組み合わせて使います。可用性の向上にもつながります。"],
["c58","c","障害の発生から、システムを復旧させるまでに許容される最大の時間を表す指標はどれですか?",["RTO(目標復旧時間)","RPO(目標復旧時点)","SLA(サービスレベル契約)","TCO(総所有コスト)"],0,"RTOは「どれだけ早く復旧させるか」の目標です。RPOは「どの時点までのデータを復旧できればよいか」(許容できるデータ損失)の目標です。"],
["c59","c","障害発生時に、どの時点までのデータを復旧できればよいか(許容できるデータ損失の量)を表す指標はどれですか?",["RPO(目標復旧時点)","RTO(目標復旧時間)","MFA","SLA"],0,"RPOが1時間なら、最大で直前1時間分のデータ損失を許容するという意味です。RPOを短くするほど、バックアップやレプリケーションの頻度を上げる必要があります。"],
["c60","c","災害対策(DR)の戦略のうち、コストは最も低いものの、復旧に最も時間がかかるものはどれですか?",["バックアップと復元","パイロットライト","ウォームスタンバイ","マルチサイト アクティブ/アクティブ"],0,"バックアップと復元は、平常時はバックアップを取るだけなのでコストが低い反面、障害時に環境を一から構築するため復旧に時間がかかります。"],
["c61","c","災害対策(DR)の戦略のうち、復旧時間は最も短いものの、コストが最も高いものはどれですか?",["マルチサイト アクティブ/アクティブ","バックアップと復元","パイロットライト","ウォームスタンバイ"],0,"マルチサイト アクティブ/アクティブは、複数のリージョンなどで本番環境を同時に稼働させるため、ほぼ停止なしで切り替えられますが、費用は最も高くなります。"],
["c62","c","アプリケーションを、独立してデプロイ・拡張できる小さなサービスの集まりとして設計するアーキテクチャを何と呼びますか?",["マイクロサービスアーキテクチャ","モノリシックアーキテクチャ","クライアントサーバー型","メインフレーム"],0,"マイクロサービスでは各サービスを独立して開発・更新・スケールできるため、変更を素早く行え、障害の影響範囲も限定しやすくなります。"],
["c63","c","サーバーレスアーキテクチャの特徴として正しいものはどれですか?",["サーバーの管理が不要で、使用量に応じて課金される","利用者がOSのパッチを適用する必要がある","常に固定台数のサーバーが稼働し続ける","オンプレミスでのみ利用できる"],0,"サーバーレスでは、サーバーのプロビジョニングや管理をAWSが行い、利用者はコードや設定に集中できます。使っていない時間には基本的に料金がかかりません。"],
["c64","c","AWS Well-Architected フレームワークで、機械学習やサーバーレスなど特定の業界や技術領域向けに追加のベストプラクティスを提供するものはどれですか?",["レンズ","ピラー(柱)","パースペクティブ","ランディングゾーン"],0,"Well-Architectedのレンズは、特定の領域に特化した質問とベストプラクティスを提供します。Well-Architected Toolでワークロードに適用できます。"],
["c65","c","オンプレミス環境の使用状況を分析し、AWSへ移行した場合のコスト見積もりを含むビジネスケースの作成を支援するサービスはどれですか?",["AWS Migration Evaluator","AWS Pricing Calculator","AWS Budgets","AWS Cost Explorer"],0,"Migration Evaluatorは、実際の使用状況データをもとに、移行後のコストを含むビジネスケースを作成できます。"],
["c66","c","オンプレミスのサーバーの構成情報、使用状況、サーバー間の依存関係を収集して、移行計画に役立てるサービスはどれですか?",["AWS Application Discovery Service","AWS Application Migration Service","AWS Config","Amazon Inspector"],0,"Application Discovery Serviceで収集した情報は、Migration Hubで確認でき、移行の計画や優先順位付けに使えます。"],
["c67","c","AWSが示す移行戦略「7つのR」に「含まれない」ものはどれですか?",["リビルド(Rebuild)","リタイア(Retire)","リロケート(Relocate)","リテイン(Retain)"],0,"7つのRは、リタイア、リテイン、リホスト、リロケート、リパーチェス、リプラットフォーム、リファクタリングです。"],
["c68","c","持続可能性に関する責任共有モデルにおいて、「顧客」の責任となるものはどれですか?",["ワークロードのリソース使用を最適化し、無駄を減らす","データセンターの電力効率を高める","再生可能エネルギーを調達する","データセンターの冷却設備を改善する"],0,"AWSはクラウド「の」持続可能性(インフラの効率化)に責任を持ち、顧客はクラウド「における」持続可能性(自分のワークロードの最適化)に責任を持ちます。"],
["c69","c","SaaSアプリやAWSサービスなどで発生したイベントをもとに、アプリケーション同士を疎結合に連携させるサーバーレスのイベントバスはどれですか?",["Amazon EventBridge","Amazon EBS","AWS Direct Connect","Amazon Route 53"],0,"Amazon EventBridgeはイベント駆動型のアーキテクチャを作るためのサービスで、イベントのルールに応じて連携先(Lambdaなど)を呼び出します。"],
["c70","c","AWS CAFが示すクラウド変革の4つのフェーズのうち、最初に行うフェーズはどれですか?",["構想(Envision)","調整(Align)","立ち上げ(Launch)","拡大(Scale)"],0,"AWS CAFの変革は、構想→調整→立ち上げ→拡大の順で進みます。構想フェーズでは、クラウドでビジネス成果をどう加速するかを明確にします。"],
["c71","c","AWS CAFのフェーズのうち、本番環境でパイロット(試験導入)を実施し、段階的にビジネス価値を示すフェーズはどれですか?",["立ち上げ(Launch)","構想(Envision)","調整(Align)","拡大(Scale)"],0,"立ち上げフェーズでは小規模な取り組みを本番で実施して成果を示し、その結果を拡大フェーズで組織全体に広げていきます。"],
["c72","c","AWS Well-Architected フレームワークが提供するものとして正しいものはどれですか?",["クラウドでワークロードを設計・運用するためのベストプラクティスと設計原則","AWSサービスの料金表","AWSのコンプライアンスレポート","サードパーティ製ソフトウェアのカタログ"],0,"Well-Architectedフレームワークは、6つの柱に沿って、安全で効率的なシステムを設計・運用するための考え方と質問を提供します。"],

// ===== 分野4 追加 (b13-b36) =====
["b13","b","短期間だけ使う、使用量が予測できない、中断できないワークロードで、前払いや長期契約なしで利用したい場合に適したEC2の購入オプションはどれですか?",["オンデマンドインスタンス","リザーブドインスタンス","スポットインスタンス","Dedicated Hosts"],0,"オンデマンドは秒単位(または時間単位)で使った分だけ支払う方式で、長期契約が不要です。開発・テストや短期間の処理に向いています。"],
["b14","b","リザーブドインスタンスの契約期間として選べるものはどれですか?",["1年または3年","1か月または6か月","5年または10年","期間の指定なし"],0,"リザーブドインスタンスとSavings Plansは、1年または3年の期間でコミットします。一般に3年の方が割引率は高くなります。"],
["b15","b","リザーブドインスタンスの支払い方法のうち、割引率が最も高いものはどれですか?",["全額前払い","一部前払い","前払いなし","月払いのオンデマンド"],0,"リザーブドインスタンスは、前払いの額が多いほど割引率が高くなります。期間は3年、支払いは全額前払いの組み合わせが最も割引率が高くなります。"],
["b16","b","契約期間中にインスタンスファミリーやOSなどを変更できるリザーブドインスタンスはどれですか?",["コンバーティブルリザーブドインスタンス","スタンダードリザーブドインスタンス","スポットインスタンス","オンデマンドキャパシティ予約"],0,"コンバーティブルRIは柔軟に変更できる代わりに、スタンダードRIより割引率が低くなります。"],
["b17","b","ソケット単位やコア単位のソフトウェアライセンス要件を満たすため、物理サーバーを丸ごと専有して利用するEC2のオプションはどれですか?",["Dedicated Hosts","ハードウェア専有インスタンス(Dedicated Instances)","スポットインスタンス","オンデマンドインスタンス"],0,"Dedicated Hostsでは物理サーバーのソケットやコアの情報を確認・管理できるため、BYOLのライセンス要件に対応できます。"],
["b18","b","ほかの顧客と共有しない専用ハードウェア上で実行されるが、物理サーバーの配置やソケット情報までは管理しないEC2のオプションはどれですか?",["ハードウェア専有インスタンス(Dedicated Instances)","Dedicated Hosts","スポットインスタンス","リザーブドインスタンス"],0,"ハードウェア専有インスタンスはハードウェアを専有しますが、物理サーバーの可視性や制御はDedicated Hostsほど細かくありません。"],
["b19","b","特定のアベイラビリティーゾーンでEC2の容量を確実に確保したい(長期契約は不要)場合に使うものはどれですか?",["オンデマンドキャパシティ予約","スポットインスタンス","Compute Savings Plans","AWS Budgets"],0,"オンデマンドキャパシティ予約を使うと、必要なときに確実にインスタンスを起動できる容量を確保できます。料金はオンデマンドと同じで、使わなくても課金されます。"],
["b20","b","AWS Lambdaの料金を決める主な要素はどれですか?",["リクエスト数と実行時間(割り当てたメモリ量に応じる)","起動しているサーバーの台数","保存しているデータの容量のみ","固定の月額料金"],0,"Lambdaは、リクエスト数と、関数の実行時間(割り当てメモリ量×時間)に応じて課金されます。"],
["b21","b","Amazon S3の料金の課金要素に「含まれない」ものはどれですか?",["インターネットからS3へのデータ転送(イン)","保存しているデータの容量","PUTやGETなどのリクエスト数","S3からインターネットへのデータ転送(アウト)"],0,"S3の料金は、保存容量、リクエスト数、データ転送(アウト)、ストレージクラスなどで決まります。インバウンドのデータ転送は通常無料です。"],
["b22","b","過去のAWSのコストと使用量をグラフで可視化して分析し、将来のコストを予測できるツールはどれですか?",["AWS Cost Explorer","AWS Pricing Calculator","AWS Artifact","AWS Trusted Advisor"],0,"Cost Explorerでは、サービス別やタグ別にコストを絞り込んで分析でき、今後の予測も確認できます。"],
["b23","b","AWSの請求に関する最も詳細なコストと使用量のデータを、定期的にAmazon S3へ出力できるものはどれですか?",["AWS Cost and Usage Report(CUR)","AWS Budgets","AWS Health Dashboard","AWS Organizations"],0,"Cost and Usage Reportは、リソース単位・時間単位の詳細な請求データを出力します。AthenaやQuickSightで分析するのに使われます。"],

["m1c08","c","ある企業は、オンプレミスのOracleデータベースを、ダウンタイムを最小限に抑えながらAmazon Aurora PostgreSQLへ移行したいと考えています。この移行に使うべきものはどれですか?(2つ選択してください)",["AWS Database Migration Service(AWS DMS)","AWS Schema Conversion Tool(AWS SCT)","AWS Snowball Edge","Amazon Athena","AWS Backup"],[0,1],"異なるエンジン間の移行では、SCTでスキーマやコードを変換し、DMSでデータを移行します。DMSは移行中もソースDBを稼働させられます。"],
["m1c09","c","ある企業は、データセンターの契約終了までに、数百台のサーバーをアプリケーションの変更なしでAWSへ移行する必要があります。最も適したサービスはどれですか?",["AWS Application Migration Service","AWS Elastic Beanstalk","AWS Migration Evaluator","Amazon Lightsail"],0,"Application Migration Serviceは、サーバーを継続的にレプリケーションし、短いダウンタイムでEC2に切り替えるリホスト用のサービスです。"],
["m1c10","c","ある企業のCFOは、クラウドへの支出を適切に管理し、投資対効果を最大化したいと考えています。AWS CAFのどのパースペクティブが、クラウドの財務管理を扱いますか?",["ガバナンス","プラットフォーム","オペレーション","セキュリティ"],0,"ガバナンスパースペクティブには、プログラム管理、リスク管理、クラウドの財務管理などの能力が含まれます。"],
["m1c11","c","ある企業は、社員にクラウドのスキルが不足していることや、組織の文化が変化に対応できていないことを懸念しています。AWS CAFのどのパースペクティブが、この課題に焦点を当てていますか?",["人材(People)","ビジネス","プラットフォーム","ガバナンス"],0,"人材パースペクティブは、文化の変革、組織設計、トレーニングによるスキル育成などを扱います。"],
["m1c12","c","ある企業は、Microsoft Windows Serverのライセンスをすでに保有しており、AWSに移行した後もそのライセンスを使い続けたいと考えています。この方式を何と呼びますか?",["BYOL(Bring Your Own License)","ライセンス込みのインスタンス","リザーブドインスタンス","AWS Marketplaceでの購入"],0,"BYOLでは既存のライセンスをAWSに持ち込めます。ライセンスの条件によっては、Dedicated Hostsが必要になります。"],
["m1c13","c","ある企業は、オンプレミスのデータセンターからAWSへ移行することで、どのコストを削減できるかを検討しています。削減が見込める費用はどれですか?(2つ選択してください)",["データセンターの電力と冷却にかかる費用","サーバーハードウェアの保守と更新にかかる費用","アプリケーションの業務ロジックを開発する費用","顧客データへのアクセス権を管理する作業","社内向けの業務マニュアルを作成する費用"],[0,1],"物理的なインフラの運用はAWSが担うため、電力・冷却・ハードウェアの保守などの費用を削減できます。アプリ開発やアクセス管理は引き続き顧客の作業です。"],
["m1c14","c","あるオンラインショップでは、セール期間中にトラフィックが10倍に増え、セールが終わると元に戻ります。リソースを需要に合わせて自動的に拡張・縮小できるクラウドの特性はどれですか?",["伸縮性(Elasticity)","耐久性(Durability)","機密性(Confidentiality)","可搬性(Portability)"],0,"伸縮性は、需要の増減に合わせてリソースを自動で増やしたり減らしたりできる特性です。"],
["m1c15","c","ある企業の注文処理システムでは、決済処理に障害が起きると注文の受付まで止まってしまいます。コンポーネント同士を疎結合にして、障害の影響が広がらないようにするために使えるサービスはどれですか?",["Amazon SQS","Amazon EBS","AWS Direct Connect","Amazon Route 53"],0,"SQSのキューを間に挟むと、受付側は処理側の状態に関係なく注文を受け付けられ、処理側は回復後にキューから処理を再開できます。"],
["m1c16","c","ある企業の開発チームは、データベースサーバーのパッチ適用やバックアップに多くの時間を取られています。アプリケーション開発に集中するため、最も適した選択肢はどれですか?",["Amazon RDSなどのマネージドデータベースサービスに移行する","より大きなEC2インスタンスにデータベースを移す","オンプレミスにデータベースサーバーを追加する","データベースのバックアップをやめる"],0,"RDSでは、パッチ適用や自動バックアップなどの運用作業をAWSが担うため、チームは開発に集中できます。"],

["m1s01","s","ある企業は、Amazon EC2インスタンスでWebアプリケーションを実行しています。責任共有モデルに基づくと、インスタンスへのインバウンド通信を制限するセキュリティグループの設定は誰の責任ですか?",["顧客","AWS","AWSと顧客の共同責任","インターネットサービスプロバイダー"],0,"セキュリティグループのルールなど、クラウド「における」セキュリティの設定は顧客の責任です。"],
["m1s02","s","ある企業は、Amazon DynamoDBを使ってアプリケーションのデータを保存しています。責任共有モデルにおいて「AWS」の責任となるものはどれですか?(2つ選択してください)",["基盤となるハードウェアの保守","データベースソフトウェアへのパッチ適用","テーブルへのアクセスを制御するIAMポリシーの設定","テーブルに保存するデータの分類","アプリケーションからのアクセス権の管理"],[0,1],"DynamoDBはマネージドサービスなので、インフラやソフトウェアの管理はAWSが行います。アクセス制御とデータの管理は顧客の責任です。"],
["m1s03","s","ある企業の監査担当者は、AWSがISO 27001の認証を受けていることを示す証拠を求めています。この資料をどこで入手できますか?",["AWS Artifact","AWS Trusted Advisor","AWS Config","Amazon Inspector"],0,"AWS Artifactでは、AWSのISO認証やSOCレポートなどのコンプライアンスレポートをダウンロードできます。"],
["m1s04","s","ある企業のセキュリティチームは、先週S3バケットを削除したのが誰かを調べたいと考えています。どのサービスで確認できますか?",["AWS CloudTrail","Amazon CloudWatch","Amazon Macie","AWS Trusted Advisor"],0,"CloudTrailはAWSアカウント内のAPI呼び出しを記録しており、誰がいつどの操作をしたかを確認できます。"],
["m1s05","s","ある企業は、セキュリティグループでSSH(ポート22)がインターネット全体に公開された場合にそれを検出し、リソースの設定履歴も記録したいと考えています。最も適したサービスはどれですか?",["AWS Config","AWS CloudTrail","Amazon GuardDuty","AWS Artifact"],0,"AWS Configはリソースの設定履歴を記録し、Configルールで設定がルールに準拠しているかを継続的に評価します。"],
["m1s06","s","ある企業に10人の開発者が入社し、全員に同じ権限を付与する必要があります。管理の手間を最小限にする方法はどれですか?",["IAMグループを作成してポリシーをアタッチし、開発者をグループに追加する","ルートユーザーの認証情報を開発者で共有する","1つのIAMユーザーを作り、全員で共有する","開発者ごとにすべての権限をインラインポリシーで付与する"],0,"IAMグループにポリシーをアタッチすると、グループ内の全ユーザーに同じ権限が適用され、権限の変更もまとめて行えます。"],
["m1s07","s","Amazon EC2インスタンスで動くアプリケーションが、Amazon DynamoDBのテーブルにデータを書き込む必要があります。最も安全な認証方法はどれですか?",["DynamoDBへの書き込み権限を持つIAMロールをインスタンスにアタッチする","IAMユーザーのアクセスキーをアプリケーションのコードに埋め込む","ルートユーザーのアクセスキーを使う","DynamoDBのテーブルを全体に公開する"],0,"IAMロールを使うと、一時的な認証情報が自動で提供・更新されるため、長期の認証情報を保存する必要がありません。"],
["m1s08","s","ある企業は、AWSアカウントのルートユーザーを保護したいと考えています。推奨される対策はどれですか?(2つ選択してください)",["ルートユーザーでMFAを有効にする","ルートユーザーのアクセスキーを作成しない(既にあれば削除する)","日常的な管理作業をルートユーザーで行う","ルートユーザーのパスワードをチームで共有する","ルートユーザーのアクセスキーをEC2インスタンスに保存する"],[0,1],"ルートユーザーはアカウントのすべての権限を持つため、MFAで保護し、アクセスキーを作らず、日常業務には使わないことが推奨されます。"],
["m1s09","s","ある企業は50のAWSアカウントを持っています。従業員が会社のIDを使い、1回のサインインで必要なアカウントにアクセスできるようにしたいと考えています。最も適したサービスはどれですか?",["AWS IAM Identity Center","Amazon Cognito","AWS Directory Service","AWS Secrets Manager"],0,"IAM Identity Centerは、複数のAWSアカウントやアプリへのシングルサインオンを一元管理し、既存のIDプロバイダーとも連携できます。"],
["m1s10","s","あるアプリケーションは、データベースの認証情報を使ってRDSに接続しています。認証情報を安全に保管し、定期的に自動でローテーションしたい場合、どのサービスを使うべきですか?",["AWS Secrets Manager","AWS KMS","AWS Certificate Manager","Amazon Macie"],0,"Secrets Managerは認証情報を暗号化して保管し、RDSなどと連携して自動ローテーションを行えます。"],
["m1s11","s","ある企業のWebアプリケーションが、SQLインジェクション攻撃を受けています。Application Load Balancerの手前で悪意のあるリクエストをブロックするために使うべきサービスはどれですか?",["AWS WAF","AWS Shield Standard","Amazon GuardDuty","ネットワークACL"],0,"AWS WAFはHTTPリクエストの内容を検査し、SQLインジェクションやXSSなどの攻撃をブロックできます。ALBやCloudFrontに関連付けて使います。"],
["m1s12","s","ある企業は、EC2インスタンスが暗号資産のマイニングに使われている疑いや、既知の悪意のあるIPアドレスとの通信を自動で検出したいと考えています。最も適したサービスはどれですか?",["Amazon GuardDuty","Amazon Inspector","AWS Config","Amazon Macie"],0,"GuardDutyは、CloudTrail、VPCフローログ、DNSログなどを分析して、悪意のある活動や不審な通信を検出します。"],
["m1s13","s","ある企業は、EC2インスタンスにインストールされたソフトウェアの既知の脆弱性を、継続的かつ自動的に検出したいと考えています。最も適したサービスはどれですか?",["Amazon Inspector","Amazon GuardDuty","AWS Shield","AWS Artifact"],0,"Amazon Inspectorは、EC2、コンテナイメージ、Lambda関数などのソフトウェアの脆弱性を継続的にスキャンします。"],
["m1s14","s","ある企業は、S3バケットに顧客の氏名やクレジットカード番号などの個人情報が保存されていないかを確認したいと考えています。最も適したサービスはどれですか?",["Amazon Macie","Amazon Inspector","AWS Shield","Amazon Detective"],0,"Amazon Macieは機械学習とパターンマッチングを使って、S3内の機密データを検出・分類します。"],
["m1s15","s","ある企業は、特定のIPアドレスからの通信を、VPCのサブネット単位でブロックしたいと考えています。何を使うべきですか?",["ネットワークACL","セキュリティグループ","IAMポリシー","AWS Artifact"],0,"ネットワークACLはサブネット単位で動作し、拒否ルールを設定できます。セキュリティグループには許可ルールしか設定できません。"],
["m1s16","s","ある企業は、AWS Organizationsの配下にあるすべてのアカウントで、どのユーザーもAWS CloudTrailを停止できないようにしたいと考えています。最も適した方法はどれですか?",["サービスコントロールポリシー(SCP)で、CloudTrailの停止操作を拒否する","各アカウントでIAMパスワードポリシーを設定する","セキュリティグループで通信をブロックする","AWS Budgetsでアラートを設定する"],0,"SCPを使うと、組織内のアカウントで実行できる操作の上限を設定でき、管理者であっても拒否された操作は実行できません。"],
["m1s17","s","ある企業は、データの暗号化に使う鍵を一元的に管理し、鍵がいつ誰によって使われたかを監査できるようにしたいと考えています。最も適したサービスはどれですか?",["AWS KMS","AWS Secrets Manager","AWS Certificate Manager","Amazon Macie"],0,"AWS KMSは暗号鍵の作成と管理を行い、鍵の使用はCloudTrailに記録されるため、監査に利用できます。"],
["m1s18","s","ある企業は、複数のアカウントにわたるGuardDutyやInspectorなどの検出結果を1か所にまとめ、AWSのセキュリティのベストプラクティスに沿っているかも自動でチェックしたいと考えています。最も適したサービスはどれですか?",["AWS Security Hub","AWS CloudTrail","Amazon Detective","AWS Organizations"],0,"Security Hubは、複数のセキュリティサービスの検出結果を集約し、ベストプラクティスへの準拠状況も自動でチェックします。"],
["m1s19","s","ある医療関連企業は、HIPAAの対象となる医療データをAWS上で扱う予定です。正しい説明はどれですか?(2つ選択してください)",["AWS Artifactを使って、AWSとの事業提携契約(BAA)を確認・締結できる","顧客は、自分のワークロードがHIPAAの要件を満たすように構成する責任がある","AWS上で動くアプリケーションは、自動的にHIPAAに準拠したことになる","HIPAAの対象データはAWSに保存できない","AWSが顧客のアプリケーションのHIPAA監査を代行する"],[0,1],"AWSはHIPAA対象のサービスを提供し、Artifactで BAA を締結できます。ただし、ワークロードの準拠は責任共有モデルに基づき顧客が確保する必要があります。"],

["m1t01","t","ある企業は、開発環境と本番環境で同じインフラ構成を、テンプレートを使って繰り返し構築したいと考えています。最も適したサービスはどれですか?",["AWS CloudFormation","AWS Config","AWS Trusted Advisor","Amazon CloudWatch"],0,"CloudFormationでは、インフラをテンプレートとしてコード化し、同じ構成を何度でも一貫して構築できます。"],
["m1t02","t","ある開発者は、毎日行っているAWSの操作を、手元のターミナルからスクリプトで自動化したいと考えています。最も適したツールはどれですか?",["AWS CLI","AWS マネジメントコンソール","AWS Artifact","AWS Pricing Calculator"],0,"AWS CLIを使うと、コマンドラインからAWSのサービスを操作でき、シェルスクリプトで自動化できます。"],
["m1t03","t","ある企業は、オンプレミスのデータセンターとAWSの間で、安定した帯域と一貫したネットワーク性能を持つ専用の接続を必要としています。最も適したサービスはどれですか?",["AWS Direct Connect","AWS Site-to-Site VPN","Amazon CloudFront","インターネットゲートウェイ"],0,"Direct Connectはインターネットを経由しない専用線で接続するため、安定した帯域と低レイテンシーが得られます。"],
["m1t04","t","ある企業は、EC2で動くWebアプリケーションの可用性を高めたいと考えています。この目的に適した構成はどれですか?(2つ選択してください)",["複数のアベイラビリティーゾーンにEC2インスタンスを配置する","Elastic Load Balancingでトラフィックを複数のインスタンスに分散する","1つのアベイラビリティーゾーンに、より大きなインスタンスを1台配置する","エッジロケーションにEC2インスタンスを配置する","1台のEC2インスタンスにElastic IPアドレスを割り当てる"],[0,1],"複数のAZにインスタンスを分散し、ELBで振り分けることで、1つのAZやインスタンスで障害が起きてもサービスを継続できます。"],
["m1t05","t","ある企業は、AWSのリージョン全体に影響する大規模な障害が起きても、アプリケーションを復旧できるようにしたいと考えています。最も適した対策はどれですか?",["別のリージョンにデータのバックアップやレプリケーションを用意する","同じリージョン内で、インスタンスタイプを大きくする","同じAZ内に、インスタンスを追加する","すべてのデータをインスタンスストアに保存する"],0,"リージョン単位の障害に備えるには、別のリージョンにデータや環境を用意する必要があります。AZの分散だけでは、リージョン全体の障害には対応できません。"],
["m1t06","t","あるゲーム会社は、5Gネットワークに接続したモバイル端末のユーザーに、超低レイテンシーのゲーム体験を提供したいと考えています。最も適したサービスはどれですか?",["AWS Wavelength","AWS Outposts","Amazon CloudFront","AWS Direct Connect"],0,"AWS Wavelengthは、通信事業者の5Gネットワーク内にAWSのコンピューティングを配置し、モバイル端末への遅延を最小化します。"],
["m1t07","t","ある銀行は、規制によりデータを自社の施設内に保持する必要がありますが、AWSと同じAPIやツールを使ってアプリケーションを動かしたいと考えています。最も適したサービスはどれですか?",["AWS Outposts","AWS Local Zones","AWS Wavelength","Amazon Lightsail"],0,"AWS Outpostsは、AWSが管理するインフラを顧客の施設に設置し、オンプレミスでAWSのサービスを利用できるようにします。"],
["m1t08","t","ある企業は、S3に画像がアップロードされるたびに、自動でサムネイル画像を作成したいと考えています。処理は数秒で終わり、サーバーの管理はしたくありません。最も適したサービスはどれですか?",["AWS Lambda","Amazon EC2","Amazon Lightsail","AWS Outposts"],0,"Lambdaは、S3へのアップロードなどのイベントをきっかけにコードを実行できるサーバーレスのサービスで、実行した分だけ課金されます。"],
["m1t09","t","ある企業は、コンテナ化したアプリケーションを実行したいと考えていますが、コンテナを動かすサーバーの管理はしたくありません。最も適した組み合わせはどれですか?",["Amazon ECSとAWS Fargate","Amazon EC2とAmazon EBS","Amazon ECRとAmazon S3","AWS Lambdaと Amazon EFS"],0,"Fargateを使うと、ECSやEKSのコンテナを、サーバーやクラスターを管理せずに実行できます。"],
["m1t10","t","あるWebアプリケーションでは、CPU使用率に応じてEC2インスタンスの台数を自動で増減させたいと考えています。最も適したサービスはどれですか?",["Amazon EC2 Auto Scaling","Elastic Load Balancing","AWS Config","Amazon Route 53"],0,"EC2 Auto Scalingは、CloudWatchのメトリクスなどに基づいてインスタンス数を自動で調整します。"],
["m1t11","t","ある企業は、リレーショナルデータベースをマネージドサービスで運用し、AZの障害時にも自動でフェイルオーバーさせたいと考えています。最も適した構成はどれですか?",["Amazon RDSのマルチAZ配置","Amazon RDSのリードレプリカ","EC2インスタンスにデータベースをインストールする","Amazon DynamoDBのオンデマンドモード"],0,"マルチAZ配置では、別のAZにスタンバイが同期レプリケーションされ、障害時に自動でフェイルオーバーします。"],
["m1t12","t","あるゲーム会社は、プレイヤーのセッション情報を保存するデータベースを必要としています。どれだけ規模が大きくなっても1桁ミリ秒で応答できる、サーバーレスのキーバリューデータベースが必要です。最も適したサービスはどれですか?",["Amazon DynamoDB","Amazon RDS","Amazon Redshift","Amazon Neptune"],0,"DynamoDBはフルマネージドでサーバーレスのNoSQLデータベースで、規模にかかわらず高速な応答を提供します。"],
["m1t13","t","あるWebアプリケーションでは、同じデータの読み取りが繰り返し発生し、データベースの負荷が高くなっています。よく使うデータをメモリにキャッシュして応答を速くしたい場合、どのサービスを使うべきですか?",["Amazon ElastiCache","Amazon S3 Glacier","AWS Backup","Amazon EFS"],0,"ElastiCacheはインメモリのキャッシュサービスで、データベースの前に置くことで読み取りの負荷を減らし、応答を高速化します。"],
["m1t14","t","ある企業は、ペタバイト規模の売上データに対して複雑な分析クエリを実行し、BIツールでレポートを作成したいと考えています。最も適したサービスはどれですか?",["Amazon Redshift","Amazon DynamoDB","Amazon ElastiCache","Amazon RDS for MySQL"],0,"Amazon Redshiftは分析用途に最適化されたデータウェアハウスで、大量データに対する集計クエリを高速に実行できます。"],
["m1t15","t","ある企業は、複数のリージョンでアプリケーションを動かしています。ユーザーを、最も応答の速いリージョンへ自動で振り分けたいと考えています。何を使うべきですか?",["Amazon Route 53のレイテンシーベースのルーティング","Amazon Route 53のシンプルルーティング","AWS Direct Connect","NATゲートウェイ"],0,"レイテンシーベースのルーティングは、ユーザーとの間のレイテンシーが最も小さいリージョンのリソースへ通信を振り分けます。"],
["m1t16","t","プライベートサブネットにあるEC2インスタンスが、OSの更新プログラムをインターネットからダウンロードする必要があります。インターネットからインスタンスへの直接の接続は許可したくありません。何を使うべきですか?",["NATゲートウェイ","インターネットゲートウェイを各インスタンスに直接アタッチする","VPCピアリング","Amazon CloudFront"],0,"NATゲートウェイを使うと、プライベートサブネットからのアウトバウンド通信だけを許可し、外部からの接続は受け付けません。"],
["m1t17","t","あるメディア企業は、世界中のユーザーに画像や動画を高速に配信したいと考えています。コンテンツをユーザーの近くにキャッシュして配信できるサービスはどれですか?",["Amazon CloudFront","Amazon Route 53","AWS Global Accelerator","Elastic Load Balancing"],0,"CloudFrontは世界中のエッジロケーションにコンテンツをキャッシュし、ユーザーに近い場所から配信するCDNです。"],
["m1t18","t","ある企業は、規制により監査ログを7年間保存する必要があります。ログにアクセスすることはほとんどなく、取り出しに12時間程度かかっても問題ありません。最もコストの低い保存先はどれですか?",["Amazon S3 Glacier Deep Archive","Amazon S3 Standard","Amazon S3 Standard-IA","Amazon EBS"],0,"Glacier Deep ArchiveはS3で最も安いストレージクラスで、取り出しに時間がかかってもよい長期保管データに向いています。"],
["m1t19","t","ある企業では、複数のLinux EC2インスタンスから、同じファイルに同時にアクセスする必要があります。容量は自動で増減してほしいと考えています。最も適したサービスはどれですか?",["Amazon EFS","Amazon EBS","インスタンスストア","Amazon S3 Glacier Flexible Retrieval"],0,"Amazon EFSは複数のEC2インスタンスから同時にマウントできるファイルシステムで、保存量に応じて容量が自動で伸縮します。"],
["m1t20","t","あるコールセンターは、通話の録音データを文字に起こし、その内容から顧客の感情を分析したいと考えています。使うべきサービスはどれですか?(2つ選択してください)",["Amazon Transcribe","Amazon Comprehend","Amazon Polly","Amazon Rekognition","Amazon Lex"],[0,1],"Transcribeで音声をテキストに変換し、Comprehendでテキストの感情分析を行います。Pollyは逆にテキストを音声にするサービスです。"],
["m1t21","t","ある企業は、S3に保存したログファイルをサーバーを用意せずにSQLで分析し、その結果をダッシュボードで可視化したいと考えています。使うべきサービスはどれですか?(2つ選択してください)",["Amazon Athena","Amazon QuickSight","Amazon Polly","Amazon Neptune","Amazon Lex"],[0,1],"AthenaはS3のデータを直接SQLでクエリでき、QuickSightはその結果をダッシュボードとして可視化できます。"],
["m1t22","t","ある通販サイトでは、注文が入ったときに、在庫・配送・請求の3つのシステムへ同時に通知し、各システムは自分のペースで処理を進めたいと考えています。使うべきサービスの組み合わせはどれですか?(2つ選択してください)",["Amazon SNS","Amazon SQS","Amazon Athena","AWS Glue","Amazon Polly"],[0,1],"SNSのトピックで1つのメッセージを複数のSQSキューに同時に配信(ファンアウト)し、各システムはそれぞれのキューから自分のペースで処理できます。"],

["m1b01","b","ある企業は、今後3年間、EC2、AWS Fargate、AWS Lambdaを継続的に利用する予定です。インスタンスファミリーやリージョンを変更する可能性があり、その場合でも割引を受けたいと考えています。最も適した料金モデルはどれですか?",["Compute Savings Plans","EC2 Instance Savings Plans","スタンダードリザーブドインスタンス","スポットインスタンス"],0,"Compute Savings Plansは、インスタンスファミリー、サイズ、リージョンにかかわらず、EC2、Fargate、Lambdaの利用に割引が適用されます。"],
["m1b02","b","ある研究機関は、途中で中断されても再開できる大量のシミュレーション処理を、できるだけ低いコストで実行したいと考えています。最も適したEC2の購入オプションはどれですか?",["スポットインスタンス","オンデマンドインスタンス","Dedicated Hosts","スタンダードリザーブドインスタンス"],0,"スポットインスタンスは大幅な割引で使えますが、中断される可能性があるため、中断に強い処理に向いています。"],
["m1b03","b","ある企業は、月末の予測コストが設定した予算を超えそうになったら、担当者にメールで通知したいと考えています。最も適したサービスはどれですか?",["AWS Budgets","AWS Cost Explorer","AWS Pricing Calculator","AWS Trusted Advisor"],0,"AWS Budgetsでは、実績や予測のコストが予算のしきい値を超えたときに通知を送れます。"],
["m1b04","b","ある企業の財務担当者は、過去6か月間のAWSの支出をサービス別に分析し、どのサービスのコストが増えているかを把握したいと考えています。最も適したツールはどれですか?",["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Artifact"],0,"Cost Explorerでは、過去のコストと使用量をサービスやタグなどで絞り込んでグラフで分析できます。"],
["m1b05","b","ある企業は、オンプレミスのシステムをAWSへ移行した場合の月額コストを、移行前に見積もりたいと考えています。最も適したツールはどれですか?",["AWS Pricing Calculator","AWS Cost Explorer","AWS Budgets","AWS Cost and Usage Report"],0,"Pricing Calculatorは、まだ利用していないサービスの構成を入力して、料金を事前に見積もれる無料のツールです。"],
["m1b06","b","ある企業は、部門ごとに複数のAWSアカウントを使っています。請求を1つにまとめ、合算した使用量によるボリュームディスカウントを受けたいと考えています。最も適したサービスはどれですか?",["AWS Organizations","AWS IAM Identity Center","AWS Control Tower","AWS Cost Explorer"],0,"AWS Organizationsの一括請求機能を使うと、複数アカウントの請求をまとめ、使用量の合算による割引を受けられます。"],
["m1b07","b","ある企業は、本番システムが停止した場合に1時間以内にAWSのサポートから応答を受けたいと考えています。この要件を満たす最も低価格のサポートプランはどれですか?",["Business","Developer","Basic","Enterprise"],0,"Businessサポートでは、本番システムの停止時に1時間以内の応答が受けられ、24時間365日の電話サポートも利用できます。"],
["m1b08","b","ある企業は、追加料金なしのBasicサポートを利用しています。このプランで利用できるものはどれですか?(2つ選択してください)",["AWS re:Post","AWS Health Dashboard","テクニカルアカウントマネージャー(TAM)","技術的な問題についての24時間の電話サポート","AWS Trusted Advisorのすべてのチェック"],[0,1],"Basicサポートには、ドキュメント、AWS re:Post、AWS Health Dashboard、Trusted Advisorのコアチェック、請求とアカウントに関するサポートが含まれます。"]

// ===== 模試2 =====
["m2c01","c","ある企業のデータサイエンスチームは、新しい機械学習のアイデアを試すために、必要なリソースをすぐに用意し、不要になったらすぐに削除したいと考えています。AWSクラウドのどの利点が該当しますか?",["速度と俊敏性の向上","規模の経済","固定費の増加","データセンターの所有"],0,"クラウドではリソースを数分で用意・削除できるため、低いコストで素早く実験を繰り返せます。"],
["m2c02","c","AWSが、多くの企業が自社で設備を運用するよりも低い料金でサービスを提供できる理由として、最も適切なものはどれですか?",["多数の顧客の利用を集約することで、規模の経済が働くため","顧客ごとに専用のデータセンターを建設しているため","利用者がハードウェアを購入しているため","すべてのサービスが無料で提供されているため"],0,"AWSは膨大な数の顧客の利用を集約することで規模の経済を実現し、その分を低い従量料金として還元しています。"],
["m2c03","c","ある企業は、データセンターのラックの設置、電源の管理、サーバーの交換といった作業をやめ、その分の人員を顧客向けのサービス開発に振り向けたいと考えています。AWSクラウドのどの利点が該当しますか?",["データセンターの運用と保守への投資が不要になる","キャパシティの推測が不要になる","規模の経済の恩恵を受ける","数分でグローバルに展開できる"],0,"物理的なインフラの運用をAWSに任せることで、自社のビジネスを差別化する活動に集中できます。"],
["m2c04","c","ある企業は、必要な分だけリソースに支払い、ワークロードの全体的な効率を測定して、不要な支出を減らしたいと考えています。AWS Well-Architected フレームワークのどの柱を参照すべきですか?",["コスト最適化","持続可能性","セキュリティ","信頼性"],0,"コスト最適化の柱は、消費モデルの導入、全体的な効率の測定、支出の分析と帰属などを設計原則としています。"],
["m2c05","c","ある企業は、システムを監視して日々の運用を改善し、変更を自動化して、障害から得た教訓を共有する仕組みを作りたいと考えています。AWS Well-Architected フレームワークのどの柱を参照すべきですか?",["運用上の優秀性","パフォーマンス効率","コスト最適化","持続可能性"],0,"運用上の優秀性の柱は、システムの運用と監視、プロセスや手順の継続的な改善に焦点を当てています。"],
["m2c06","c","ある企業は、データベースや機械学習などの高度な技術を、自分たちで専門知識を身につけずにマネージドサービスとして活用し、必要に応じて世界中に素早く展開したいと考えています。AWS Well-Architected フレームワークのどの柱の考え方ですか?",["パフォーマンス効率","信頼性","セキュリティ","運用上の優秀性"],0,"パフォーマンス効率の柱には、「高度な技術の民主化」「数分でグローバル展開」「サーバーレスの活用」などの設計原則があります。"],
["m2c07","c","AWS Well-Architected フレームワークの「信頼性」の柱の設計原則として正しいものはどれですか?(2つ選択してください)",["障害から自動的に復旧する","キャパシティを推測するのをやめる","1台の大きなサーバーにすべての処理を集約する","インフラへの変更はすべて手作業で行う","障害時の復旧手順はテストしない"],[0,1],"信頼性の柱の設計原則には、障害からの自動復旧、復旧手順のテスト、水平スケーリング、キャパシティを推測しないこと、自動化による変更管理があります。"],
["m2c08","c","ある企業は移行の計画中に、メインフレームで動いている一部のアプリケーションについて、移行の準備が整うまでは当面オンプレミスで運用を続けることにしました。この移行戦略はどれですか?",["リテイン(Retain)","リタイア(Retire)","リホスト(Rehost)","リファクタリング(Refactor)"],0,"リテインは、今は移行せずに現状のまま保持する戦略です。準備が整った段階で、あらためて移行を検討します。"],
["m2c09","c","ある企業は、機能の追加に時間がかかるモノリシックなアプリケーションを、俊敏性を高めるためにAWS Lambdaなどを使ったサーバーレスのアーキテクチャに作り直すことにしました。この移行戦略はどれですか?",["リファクタリング(Refactor)","リホスト(Rehost)","リロケート(Relocate)","リテイン(Retain)"],0,"リファクタリング(リアーキテクト)は、クラウドネイティブな機能を活用するためにアプリを再設計する戦略です。"],
["m2c10","c","ある企業は、アプリケーションをEC2へ移行する際に、自社で運用していたMySQLデータベースだけをAmazon RDSに置き換えることにしました。アプリケーションのコードはほぼ変更しません。この移行戦略はどれですか?",["リプラットフォーム(Replatform)","リパーチェス(Repurchase)","リファクタリング(Refactor)","リタイア(Retire)"],0,"リプラットフォームは、コアのアーキテクチャを変えずに、マネージドサービスの活用などで一部を最適化する戦略です。"],
["m2c11","c","ある企業は、スケーラブルなハイブリッドクラウド環境を構築し、データアーキテクチャやCI/CDの仕組みを整えたいと考えています。AWS CAFのどのパースペクティブに該当しますか?",["プラットフォーム","人材(People)","ビジネス","ガバナンス"],0,"プラットフォームパースペクティブは、クラウド基盤の構築や、アーキテクチャ、エンジニアリングの能力を扱います。"],
["m2c12","c","ある企業は、クラウドサービスがビジネスの要求を満たすレベルで提供されるよう、監視、インシデント管理、パッチ管理の体制を整えたいと考えています。AWS CAFのどのパースペクティブに該当しますか?",["オペレーション","ビジネス","人材(People)","プラットフォーム"],0,"オペレーションパースペクティブは、日々の運用・監視・インシデント対応などの能力を扱います。"],
["m2c13","c","ある企業は、AWS CAFの6つのパースペクティブにわたって、クラウド導入に必要な能力のギャップや部門間の依存関係を洗い出したいと考えています。これはAWS CAFのどのフェーズの活動ですか?",["調整(Align)","構想(Envision)","立ち上げ(Launch)","拡大(Scale)"],0,"調整フェーズでは、能力のギャップや組織間の依存関係を特定し、変革の準備を整えます。"],
["m2c14","c","ある企業のEC2インスタンスは、CPU使用率が常に5%程度しかありません。コストを削減するために最初に検討すべき対策はどれですか?",["より小さいインスタンスタイプに変更する(ライトサイジング)","インスタンスの台数を増やす","より大きいインスタンスタイプに変更する","Dedicated Hostsに移行する"],0,"使用率の低いリソースを実際の需要に合ったサイズに見直すライトサイジングは、代表的なコスト最適化の手法です。"],
["m2c15","c","ある企業は、EC2上で自社運用していたデータベースをAmazon RDSに移行しました。この移行によって、企業が行う必要がなくなった作業はどれですか?(2つ選択してください)",["データベースのOSへのパッチ適用","データベースの自動バックアップの仕組みの構築と運用","データベースのスキーマ設計","アプリケーションのクエリの最適化","データベースユーザーのアクセス権の管理"],[0,1],"RDSでは、OSやDBエンジンのパッチ適用、自動バックアップなどの運用をAWSが担います。スキーマ設計やクエリの最適化、アクセス権の管理は引き続き顧客の作業です。"],
["m2c16","c","ある企業は災害対策として、別のリージョンにデータベースのレプリカなど中核となる最小限の要素だけを常時稼働させておき、災害時にほかのリソースを起動して本番環境を復旧させたいと考えています。この災害対策の戦略はどれですか?",["パイロットライト","バックアップと復元","マルチサイト アクティブ/アクティブ","リタイア"],0,"パイロットライトは、中核部分だけを常に動かしておく戦略で、バックアップと復元より早く復旧でき、ウォームスタンバイよりコストを抑えられます。"],

["m3t11","t","あるニュースサイトでは、記事の閲覧(読み取り)が急増し、Amazon RDSの負荷が高くなっています。書き込みの性能に影響を与えずに、読み取りの処理を分散したいと考えています。最も適した方法はどれですか?",["リードレプリカを作成し、読み取りの処理を振り分ける","マルチAZ配置のスタンバイに読み取りを振り分ける","データベースのバックアップ頻度を上げる","インスタンスストアにデータを保存する"],0,"リードレプリカは読み取り専用のコピーで、読み取りの負荷を分散できます。マルチAZのスタンバイは、主に可用性を高めるためのものです。"],
["m3t12","t","AWSが提供する、マネージド型のリレーショナルデータベースサービスはどれですか?(2つ選択してください)",["Amazon RDS","Amazon Aurora","Amazon DynamoDB","Amazon Neptune","Amazon ElastiCache"],[0,1],"RDSとAuroraはリレーショナルデータベースのマネージドサービスです。DynamoDBはNoSQL、Neptuneはグラフ、ElastiCacheはインメモリキャッシュです。"],

["m3t16","t","ある企業は、メインのリージョンにあるWebサイトが停止した場合に、別のリージョンに用意した待機用のサイトへ、DNSで自動的に切り替えたいと考えています。最も適したものはどれですか?",["Amazon Route 53のフェイルオーバールーティング","Amazon Route 53の加重ルーティング","AWS Direct Connect","NATゲートウェイ"],0,"フェイルオーバールーティングはヘルスチェックの結果に基づき、プライマリが異常なときにセカンダリへ通信を切り替えます。"],
["m3t17","t","ある企業は、AWS Lambdaの関数をバックエンドとするREST APIを作成し、認証やリクエスト数の制限も設定して公開したいと考えています。最も適したサービスはどれですか?",["Amazon API Gateway","Elastic Load Balancing","Amazon Route 53","AWS Direct Connect"],0,"API Gatewayは、APIの作成・公開・管理を行うフルマネージドサービスで、Lambdaと組み合わせてサーバーレスなAPIを構築できます。"],

function need(q){return isMR(q)? q[4].length : 1;}
function sel(a,oi){return Array.isArray(a)? a.indexOf(oi)>=0 : a===oi;}
function isRight(q,oi){return isMR(q)? q[4].indexOf(oi)>=0 : oi===q[4];}
function complete(q,a){return isMR(q)? (Array.isArray(a)&&a.length===need(q)) : (a!==undefined&&a!==null);}
function isOK(q,a){ if(!complete(q,a)) return false; return isMR(q)? q[4].every(x=>a.indexOf(x)>=0) : a===q[4]; }
const LS_KEY = "clf-c02-progress-v1";

function addExams(list){
  const have=new Set(exams.map(x=>x.t));
  list.forEach(x=>{ if(x&&x.v===1&&typeof x.t==="number"&&!have.has(x.t)){exams.push(x);have.add(x.t);} });
  exams.sort((a,b)=>b.t-a.t);
}
async function saveExamRemote(rec){
  if(!remote.col) return;

}

async function flushRemote(){

      const localOnly = exams.filter(x=>!remoteTs.has(x.t));
      addExams(remoteExams); saveLocalExams();
      for(const x of localOnly){ await saveExamRemote(x); }
    }catch(e){}
    if(snap.exists){
      const d = snap.data();
      if(d && d.v===1 && (d.u||0) >= (store.u||0)){
        store = JSON.parse(JSON.stringify(d));
        if(!store.flags) store.flags=[]; if(!store.stats) store.stats={}; if(!store.history) store.history=[];
        saveLocal();
      } else { flushRemote(); }
    } else if(store.u){ flushRemote(); }
    remote.status="synced";
    if(view==="home") renderHome(true);
  }catch(e){ remote.status="error"; updateSyncNote(); }
}
function updateSyncNote(){
  const el=document.getElementById("sync"); if(!el) return;
  el.textContent = remote.status==="synced" ? "学習記録はあなたのアカウントに保存され、ほかの端末からも引き継がれます。"

    : "学習記録はこのブラウザに保存されています。";
}
function stat(id){return store.stats[id]||{s:0,w:0};}
function record(id,correct){
  const st = Object.assign({s:0,w:0},store.stats[id]); st.s++; if(!correct) st.w++; store.stats[id]=st;
}
function isFlag(id){return store.flags.indexOf(id)>=0;}
function toggleFlag(id){
  const i=store.flags.indexOf(id); if(i>=0) store.flags.splice(i,1); else store.flags.push(id);
  persist();
}

/* ---------- utils ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
function fmtDate(t){const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

function poolFor(){
  const ds = DKEYS.filter(k=>cfg.domains[k]);
  let pool = SETQ().filter(q=>ds.indexOf(q[1])>=0).map(q=>q[0]);
  if(cfg.source==="flagged") pool = pool.filter(isFlag);
  return pool;
}
function pickPractice(){
  let pool = poolFor();
  const n = Math.min(cfg.count,pool.length);
  if(cfg.source==="weak"){
    const r = shuffle(pool).map(id=>{const st=stat(id);return {id, g: st.w>0 ? 2 : (st.s===0?1:0), w:st.w, rate: st.s? st.w/st.s : 0};});
    r.sort((a,b)=>b.g-a.g || b.w-a.w || b.rate-a.rate);
    return r.slice(0,n).map(x=>x.id);
  }
  return shuffle(pool).slice(0,n);
}
function pickExam(arr){
  let ids=[];
  DKEYS.forEach(k=>{ ids = ids.concat(shuffle(arr.filter(q=>q[1]===k).map(q=>q[0])).slice(0,DOM[k].exam)); });
  return ids;
}

/* ---------- session ---------- */
let S = null, timerId = null;
function startSession(mode, ids, label){
  const order = shuffle(ids);
  const opt = {}; order.forEach(id=>opt[id]=shuffle(BY[id][3].map((_,i)=>i)));
  S = {mode, ids:order, opt, idx:0, ans:{}, done:{}, label, srcIds:ids.slice(), t0:Date.now(), deadline: mode==="exam"? Date.now()+EXAM_SEC*1000 : 0, grid:false};
  if(mode==="exam") startTimer();
  renderQ();
}
function startTimer(){stopTimer(); timerId=setInterval(()=>{
  const left=(S.deadline-Date.now())/1000; const el=document.getElementById("timer");
  if(el){el.textContent=fmtTime(left); el.classList.toggle("low",left<300);}
  if(left<=0){stopTimer(); finish();}
},1000);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

function renderQ(){
  view="q";
  const id=S.ids[S.idx], q=BY[id], d=DOM[q[1]], n=S.ids.length;
  const chosen=S.ans[id]; const revealed = S.mode==="practice" && S.done[id];
  const mr=isMR(q), k=need(q);
  const answered = S.ids.filter(x=>complete(BY[x],S.ans[x])).length;
  const pct = S.mode==="exam"? answered/n*100 : (Object.keys(S.done).length/n*100);
  const opts = S.opt[id].map((oi,pos)=>{
    let cls="opt", verdict="";
    const s=sel(chosen,oi);
    if(s) cls+=" sel";
    if(revealed){ if(isRight(q,oi)){cls+=" ok"; verdict= s?"正解":"正答";} else if(s){cls+=" ng"; verdict="あなたの解答";} }
    return `<li><button type="button" class="${cls}" data-oi="${oi}" ${revealed?"disabled":""} aria-pressed="${s}"><span class="oval">${LABELS[pos]}</span><span>${esc(q[3][oi])}</span>${verdict?`<span class="verdict">${verdict}</span>`:""}</button></li>`;
  }).join("");
  let explain="";
  if(revealed){const ok=isOK(q,chosen); explain=`<div class="explain ${ok?"ok":"ng"}" id="exp" tabindex="-1"><h3>${ok?"正解":"不正解"}</h3><p>${esc(q[5])}</p></div>`;}
  const flagged=isFlag(id);
  const last = S.idx===n-1;
  let nav;
  if(S.mode==="practice"){
    nav = `<div class="nav"><button class="btn ghost" id="quit">中断してホームへ</button>
      ${revealed? `<button class="btn primary" id="next">${last?"結果を見る":"次の問題"}</button>` : mr? `<button class="btn primary" id="submitMR" ${complete(q,chosen)?"":"disabled"}>解答する(${Array.isArray(chosen)?chosen.length:0}/${k})</button>` : `<span class="muted small" style="align-self:center">選択肢を選ぶと正誤が表示されます</span>`}</div>`;
  } else {
    nav = `<div class="nav"><div class="row"><button class="btn ghost" id="prev" ${S.idx===0?"disabled":""}>前へ</button><button class="btn ghost" id="next2" ${last?"disabled":""}>次へ</button></div>
      <div class="row"><button class="btn ghost" id="gridT" aria-expanded="${S.grid}">問題一覧</button><button class="btn primary" id="grade">採点する</button></div></div>
      ${S.grid? gridHTML():""}
      <div class="nav" style="margin-top:28px"><button class="btn ghost small" id="quit">中断してホームへ</button></div>`;
  }
  app.innerHTML = `
  <div class="bar"><div class="row">
    <span class="qno">${S.idx+1} <span class="muted">/ ${n}</span></span>
    <div class="row">
      ${S.mode==="exam"?`<span class="timer" id="timer" aria-label="残り時間">${fmtTime((S.deadline-Date.now())/1000)}</span>`:""}
      <button class="iconbtn" id="flag" aria-pressed="${flagged}">${FLAG_SVG}${flagged?"見直し中":"見直し"}</button>
    </div></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
  </div>
  <span class="dtag" style="--dc:${d.color}">${d.name}</span>${mr?`<span class="mrtag">${k}つ選択</span>`:""}
  <p class="qtext" id="qt" tabindex="-1">${esc(q[2])}</p>
  <ul class="opts" ${mr?`aria-label="${k}つ選択"`:""}>${opts}</ul>
  ${mr&&!revealed?'<p class="mrnote" id="mrnote" aria-live="polite"></p>':""}
  ${explain}${nav}`;

  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  document.getElementById("flag").onclick=()=>{toggleFlag(id);renderQ();document.getElementById("flag").focus();};
  const on=(i,f)=>{const el=document.getElementById(i); if(el) el.onclick=f;};
  on("quit",()=>confirmDlg("この回の結果は履歴に残りません(解いた問題の正誤は苦手データに反映済みです)。ホームに戻りますか?","ホームに戻る",renderHome));
  on("next",()=>{ if(last) finish(); else {S.idx++;renderQ();scrollTop();} });
  on("prev",()=>{S.idx--;renderQ();scrollTop();});
  on("next2",()=>{S.idx++;renderQ();scrollTop();});
  on("gridT",()=>{S.grid=!S.grid;renderQ();});
  on("submitMR",()=>{ if(!complete(q,S.ans[id])) return; S.done[id]=true; record(id,isOK(q,S.ans[id])); persist(); renderQ(); const e=document.getElementById("exp"); if(e) e.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); });
  on("grade",()=>{
    const un = n-answered;
    confirmDlg(un? `未解答が ${un} 問あります。このまま採点しますか?` : "採点します。よろしいですか?","採点する",finish);
  });
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{S.idx=+c.dataset.i;renderQ();scrollTop();});
  if(revealed){const e=document.getElementById("next"); if(e) e.focus({preventScroll:true});}
}
function scrollTop(){window.scrollTo(0,0); const t=document.getElementById("qt"); if(t) t.focus({preventScroll:true});}
function gridHTML(){
  return `<div class="grid" role="group" aria-label="問題一覧">${S.ids.map((id,i)=>`<button type="button" class="cell ${complete(BY[id],S.ans[id])?"ans":""} ${i===S.idx?"cur":""} ${isFlag(id)?"fl":""}" data-i="${i}" aria-label="問題${i+1}${complete(BY[id],S.ans[id])?" 解答済み":" 未解答"}${isFlag(id)?" 見直し":""}">${i+1}</button>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--guide-soft);border-color:var(--guide)"></i>解答済み</span><span><i></i>未解答</span><span><i style="border-radius:50%;background:var(--flag);border-color:var(--flag)"></i>見直し</span></div>`;
}
function choose(oi){
  const id=S.ids[S.idx], q=BY[id];
  if(isMR(q)){
    if(S.mode==="practice"&&S.done[id]) return;
    const a=Array.isArray(S.ans[id])? S.ans[id].slice() : [];
    const i=a.indexOf(oi);
    if(i>=0) a.splice(i,1);
    else if(a.length>=need(q)){ const m=document.getElementById("mrnote"); if(m) m.textContent="選べるのは"+need(q)+"つまでです。選択を外してから選び直してください。"; return; }
    else a.push(oi);
    if(a.length) S.ans[id]=a; else delete S.ans[id];
    renderQ(); const b=app.querySelector('.opt[data-oi="'+oi+'"]'); if(b) b.focus({preventScroll:true});
    return;
  }
  if(S.mode==="practice"){
    if(S.done[id]) return;
    S.ans[id]=oi; S.done[id]=true; record(id, isOK(q,oi)); persist();
    renderQ(); const e=document.getElementById("exp"); if(e) e.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  } else {
    S.ans[id]=oi; renderQ();
  }
}

/* ---------- results ---------- */
let R=null;
function finish(){
  stopTimer();
  const ids = S.ids;
  const answeredIds = S.mode==="practice"? ids.filter(id=>S.done[id]) : ids;
  const dom={}; DKEYS.forEach(k=>dom[k]={ok:0,n:0});
  let correct=0; const wrong=[];
  answeredIds.forEach(id=>{const q=BY[id]; const ok=isOK(q,S.ans[id]); dom[q[1]].n++; if(ok){dom[q[1]].ok++;correct++;} else wrong.push(id);
    if(S.mode==="exam" && S.ans[id]!==undefined) record(id,ok);});
  const entry={t:Date.now(),mode:S.mode,label:S.label,total:answeredIds.length,correct,dom,sec:Math.round((Date.now()-S.t0)/1000)};
  if(answeredIds.length){ store.history.push(entry); if(store.history.length>100) store.history=store.history.slice(-100); persist(); }
  if(S.mode==="exam"){
    const ans={}; Object.keys(S.ans).forEach(k=>ans[k]=S.ans[k]);
    const rec={v:1,t:entry.t,label:S.label,total:entry.total,correct,dom,sec:entry.sec,timeUp:Date.now()>=S.deadline,ids:ids.slice(),opt:S.opt,ans};
    addExams([rec]); saveLocalExams(); saveExamRemote(rec);
  }
  R={entry,wrong,ids:answeredIds,ans:Object.assign({},S.ans),mode:S.mode,srcIds:S.srcIds,label:S.label,opt:S.opt,showAll:false,timeUp:S.mode==="exam"&&Date.now()>=S.deadline};
  renderResult();
}
function openExam(t){
  const x=exams.find(e=>e.t===t); if(!x) return;
  const ids=x.ids.filter(id=>BY[id]);
  const wrong=ids.filter(id=>!isOK(BY[id],x.ans[id]));
  R={entry:{t:x.t,mode:"exam",label:x.label,total:x.total,correct:x.correct,dom:x.dom,sec:x.sec},wrong,ids,ans:x.ans,mode:"exam",srcIds:ids,label:x.label,opt:x.opt,showAll:false,timeUp:!!x.timeUp,past:true};
  renderResult();
}
function renderResult(){
  view="r";
  const e=R.entry, pct=e.total? Math.round(e.correct/e.total*100):0;
  const domRows = DKEYS.filter(k=>e.dom[k].n>0).map(k=>{const v=e.dom[k];const p=Math.round(v.ok/v.n*100);
    return `<span style="--dc:${DOM[k].color}">${DOM[k].short}</span><span class="track" style="--dc:${DOM[k].color}" role="img" aria-label="${DOM[k].short} ${p}%"><i style="width:${p}%"></i></span><span class="n">${v.ok}/${v.n}<span class="muted small"> (${p}%)</span></span>`;}).join("");
  const list = (R.showAll? R.ids : R.wrong).map((id,i)=>{
    const q=BY[id], a=R.ans[id], ok=isOK(q,a); const d=DOM[q[1]];
    const pos = oi=>LABELS[R.opt[id].indexOf(oi)];
    const fmt = v => (Array.isArray(v)? v.slice() : [v]).sort((x,y)=>R.opt[id].indexOf(x)-R.opt[id].indexOf(y)).map(oi=>pos(oi)+". "+esc(q[3][oi])).join(" / ");
    return `<li><div class="top"><span class="dtag" style="--dc:${d.color};margin:0">${d.short}</span><button class="iconbtn" data-flag="${id}" aria-pressed="${isFlag(id)}">${FLAG_SVG}${isFlag(id)?"見直し中":"見直し"}</button></div>
      <p class="q">${isMR(q)?'<span class="mrtag" style="margin:0 6px 0 0">'+need(q)+'つ選択</span>':""}${esc(q[2])}</p>
      <p class="a ${ok?"okt":"ngt"}">あなたの解答:${(a===undefined||a===null||(Array.isArray(a)&&!a.length))?"未解答":fmt(a)}</p>
      ${ok?"":`<p class="a okt">正答:${fmt(q[4])}</p>`}
      <p class="e">${esc(q[5])}</p></li>`;}).join("");
  app.innerHTML = `
  <div class="score">
    <div class="pct">${pct}<small>%</small></div>
    <div class="meta"><b>${e.correct} / ${e.total} 問 正解</b><br>
      <span class="muted small">${R.past?fmtDate(e.t)+" 実施・":""}${esc(R.label)}・所要時間 ${fmtTime(e.sec)}${R.timeUp?"(時間切れ)":""}</span><br>
      <span class="pass ${pct>=70?"y":"n"}">${pct>=70?"合格目安の70%に到達":"合格目安の70%まであと"+Math.max(0,Math.ceil(e.total*0.7)-e.correct)+"問"}</span></div>
  </div>
  <section class="block"><h2 style="margin-bottom:14px">分野ごとの正誤</h2><div class="dom">${domRows||'<span class="muted">解答した問題がありません。</span>'}</div>
    <p class="note">縦線は70%の位置です。</p></section>
  <div class="row" style="margin-bottom:34px">
    <button class="btn primary" id="retryWrong" ${R.wrong.length?"":"disabled"}>${R.past?"この回の":""}間違えた問題だけ解き直す(${R.wrong.length}問)</button>
    ${R.past?"":'<button class="btn" id="retry">やり直す</button>'}
    <button class="btn ghost" id="home">${R.past?"ホームへ戻る":"ホームへ"}</button>
  </div>
  <section class="block">
    <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${R.showAll?"すべての問題":"間違えた問題"}</h2>
      <button class="btn ghost small" id="toggleAll">${R.showAll?"間違えた問題だけ表示":"すべての問題を表示"}</button></div>
    ${list? `<ul class="review">${list}</ul>` : '<div class="empty">全問正解です。「やり直す」で順番を変えて、もう一度確認できます。</div>'}
  </section>`;
  document.getElementById("retryWrong").onclick=()=>startSession("practice",R.wrong,"解き直し "+R.wrong.length+"問");
  const rt=document.getElementById("retry"); if(rt) rt.onclick=()=>startSession(R.mode, R.srcIds, R.label);
  document.getElementById("home").onclick=()=>{const p=R.past; renderHome(); if(p){const el=document.getElementById("examList"); if(el) el.scrollIntoView();}};
  document.getElementById("toggleAll").onclick=()=>{R.showAll=!R.showAll;renderResult();document.getElementById("toggleAll").focus();};
  app.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{toggleFlag(b.dataset.flag);const on=isFlag(b.dataset.flag);b.setAttribute("aria-pressed",on);b.innerHTML=FLAG_SVG+(on?"見直し中":"見直し");});
  window.scrollTo(0,0);
}

/* ---------- dialog ---------- */
function confirmDlg(msg,okLabel,onOk){
  const prev=document.activeElement;
  const back=document.createElement("div"); back.className="dlg-back";
  back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="確認"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x>キャンセル</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(back);
  const close=()=>{back.remove(); document.removeEventListener("keydown",key); if(prev&&prev.focus&&document.contains(prev)) prev.focus();};
  const key=e=>{if(e.key==="Escape") close();};
  document.addEventListener("keydown",key);
  back.querySelector("[data-x]").onclick=close;
  back.querySelector("[data-ok]").onclick=()=>{close();onOk();};
  back.onclick=e=>{if(e.target===back) close();};
  back.querySelector("[data-ok]").focus();
}

/* keyboard: 1-4 / A-D to answer */
document.addEventListener("keydown",e=>{
  if(view!=="q"||document.querySelector(".dlg-back")||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase(); let pos=-1;
  if(k.length===1&&"12345".indexOf(k)>=0) pos=+k-1; else if(k.length===1&&"ABCDE".indexOf(k)>=0) pos="ABCDE".indexOf(k);
  if(pos>=0){const id=S.ids[S.idx]; if(pos>=S.opt[id].length) return; if(S.mode==="practice"&&S.done[id]) return; choose(S.opt[id][pos]);}
});

const l=loadLocal(); if(l){store=l; if(!store.flags)store.flags=[]; if(!store.stats)store.stats={}; if(!store.history)store.history=[];}
addExams(loadLocalExams());
renderHome();
initRemote();
})();
</script>
</body>
